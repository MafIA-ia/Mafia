<script>

const respuestas = {
"que son las coordenadas":"as coordenadas son un conjunto de números que sirven para determinar la posición exacta de un punto en un espacio determinado como un mapa, una gráfica o el espacio tridimensional ",
"que es la escuela luis padilla nervo TV":"a Escuela Luis Padilla Nervo TV es una institución educativa de nivel primaria ubicada en el municipio de Apodaca, Nuevo León. El distintivo "TV" se refiere a que opera en el Turno Vespertino.  Aquí tienes los detalles principales del plantel: Ubicación: Se encuentra en la calle Geranio S/N, en la colonia Valle de las Flores, Apodaca. Capacidad: Cuenta con 6 grupos escolares y atiende a una población aproximada de 192 alumnos. Infraestructura y Proyectos: Recientemente, la escuela ha buscado recursos para mejoras como la instalación de cámaras de vigilancia, adquisición de computadoras, pintura y la construcción de techado para áreas de bancas. Comunidad: Existe también una versión de esta escuela en el Turno Matutino (TM) que comparte instalaciones o nombre, pero funciona de manera independiente en sus procesos de inscripción. ",
"mejores componentes para gaming":" Para marzo de 2026, los mejores componentes para gaming se definen por la adopción masiva de la arquitectura Zen 5 de AMD, los procesadores Intel Core Ultra (Serie 2) y las tarjetas gráficas NVIDIA Serie 50 (Blackwell). El componente más crítico para los FPS sigue siendo la unidad de procesamiento gráfico (GPU). 
"quien es la maestra Diana":" La mejor profe, es querida y respetada.",
"que son todas las cosas que hay en el espacio":"El espacio (o el universo) es todo lo que existe, incluyendo la materia, la energía, el tiempo y el espacio mismo. Se compone de una variedad de objetos y sustancias que van desde partículas microscópicas hasta estructuras colosales.  European Space Agency European Space Agency  +2 Aquí tienes una lista de las principales "cosas" que hay en el espacio: 1. Cuerpos Celestes y Objetos Astronómicos Son los elementos físicos individuales que podemos identificar: Estrellas: Enormes esferas de gas (principalmente hidrógeno y helio) que producen su propia luz y energía. Planetas: Cuerpos rocosos o gaseosos que orbitan una estrella. Se dividen en planetas del Sistema Solar y exoplanetas (que orbitan otras estrellas). Satélites Naturales: Cuerpos que orbitan planetas, como nuestra Luna. Asteroides y Meteoroides: Fragmentos de roca y metal más pequeños que los planetas, comunes en el cinturón de asteroides. Cometas: Cuerpos de hielo, polvo y roca que desarrollan una "cola" cuando se acercan al Sol. Agujeros Negros: Regiones con una gravedad tan intensa que nada, ni siquiera la luz, puede escapar de ellas.  YouTube YouTube  +7 2. Estructuras a Gran Escala El universo organiza la materia en grupos inmensos: Galaxias: Colecciones masivas de miles de millones de estrellas, polvo y gas unidos por la gravedad. Nosotros vivimos en la Vía Láctea. Nebulosas: Nubes gigantes de gas y polvo; algunas son "guarderías" donde nacen nuevas estrellas. Cúmulos Estelares: Grupos de estrellas que se mantienen juntas por su mutua atracción gravitatoria.  Wikipedia Wikipedia  +4 3. Materia y Energía "Invisibles" La mayor parte de lo que hay en el espacio no se puede ver directamente:  Materia Oscura: Una sustancia misteriosa que no emite luz pero tiene gravedad; compone cerca del 27% del universo. Energía Oscura: Una fuerza que parece estar acelerando la expansión del universo. Polvo Cósmico y Gas Interestelar: Partículas pequeñas y átomos esparcidos function addMessage(text, className){
const chat = document.getElementById("chat");
const msg = document.createElement("div");
msg.className = "message " + className;
msg.textContent = text;
chat.appendChild(msg);
chat.scrollTop = chat.scrollHeight;
}

function hablarTexto(texto){
const voz = new SpeechSynthesisUtterance(texto);
voz.lang = "es-ES";
speechSynthesis.speak(voz);
}

function calcular(texto){

texto = texto.replace(/x/g,"*");

try{
if(/[0-9]+\s*[\+\-\*\/]\s*[0-9]+/.test(texto)){
const resultado = eval(texto);
return "El resultado es " + resultado;
}
}catch{}

return null;
}

async function respuestaIA(text){

const calc = calcular(text);
if(calc) return calc;

for(const key in respuestas){
if(text.includes(key)){
return respuestas[key];
}
}

try{
const res = await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(text));
const data = await res.json();

if(data.extract){
return data.extract.substring(0,200)+"...";
}
}catch{}

return "No encontré información, pero sigo aprendiendo 🤖";
}

async function sendMessage(){

const input = document.getElementById("userInput");
const text = input.value.trim();

if(text === "") return;

addMessage(text,"user");
input.value="";

addMessage("MafIA está pensando...","ai");

const chat = document.getElementById("chat");

setTimeout(async ()=>{

chat.removeChild(chat.lastChild);

const resp = await respuestaIA(text.toLowerCase());

addMessage(resp,"ai");
hablarTexto(resp);

},600);
}

document.getElementById("userInput").addEventListener("keypress",e=>{
if(e.key === "Enter") sendMessage();
});

function hablar(){

const reconocimiento = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

reconocimiento.lang = "es-ES";

reconocimiento.start();

reconocimiento.onresult = function(e){
const texto = e.results[0][0].transcript;
document.getElementById("userInput").value = texto;
sendMessage();
};

}

window.onload = ()=>{
addMessage("Hola 👋 soy MafIA. Puedo ayudarte con preguntas y matemáticas (sumas, restas, multiplicaciones y divisiones).","ai");
};

</script>
